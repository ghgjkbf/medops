[project]
name = "medops-core"
version = "0.1.0"
description = "FastAPI business backend: agents, MCP client, log pipeline, alerts, work orders."
requires-python = ">=3.11,<3.13"
dependencies = [
    "medops-common",
    "mcp-fw",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/medops_core"]

[tool.uv.sources]
medops-common = { workspace = true }
mcp-fw = { workspace = true }
