[project]
name = "medops-core"
version = "0.1.0"
description = "FastAPI business backend: agents, MCP client, log pipeline, alerts, work orders."
requires-python = ">=3.11,<3.13"
dependencies = [
    "medops-common",
    "mcp-fw",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "mcp>=2,<3",
    "httpx>=0.27",
    "pydantic>=2",
    "sqlalchemy>=2",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "openai>=3.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/medops_core"]

[tool.uv.sources]
medops-common = { workspace = true }
mcp-fw = { workspace = true }
