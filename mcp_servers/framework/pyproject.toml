[project]
name = "mcp-fw"
version = "0.1.0"
description = "MCP Server template base framework — community extension point."
requires-python = ">=3.11,<3.13"
dependencies = [
    "medops-common",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_fw"]

[tool.uv.sources]
medops-common = { workspace = true }
