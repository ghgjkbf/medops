[project]
name = "mcp-dr"
version = "0.1.0"
description = "DR device MCP server: generator status and detector temperature (simulated)."
requires-python = ">=3.11,<3.13"
dependencies = [
    "mcp-fw",
    "medops-common",
]

[project.scripts]
mcp-dr = "mcp_dr.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_dr"]

[tool.uv.sources]
mcp-fw = { workspace = true }
medops-common = { workspace = true }
