[project]
name = "mcp-maintenance-db"
version = "0.1.0"
description = "Maintenance-ledger MCP server: devices, work orders, repair records, alerts (PostgreSQL-backed)."
requires-python = ">=3.11,<3.13"
dependencies = [
    "mcp-fw",
    "medops-common",
    "medops-core",
    "sqlalchemy>=2",
    "psycopg2-binary>=2.9",
]

[project.scripts]
mcp-maintenance-db = "mcp_maintenance_db.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_maintenance_db"]

[tool.uv.sources]
mcp-fw = { workspace = true }
medops-common = { workspace = true }
medops-core = { workspace = true }
