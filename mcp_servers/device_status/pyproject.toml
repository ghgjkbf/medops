[project]
name = "mcp-device-status"
version = "0.1.0"
description = "Device-status MCP server (simulated): process, driver and file-integrity tools."
requires-python = ">=3.11,<3.13"
dependencies = [
    "mcp-fw",
    "medops-common",
    "psutil>=5.9",
]

[project.scripts]
mcp-device-status = "mcp_device_status.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_device_status"]

[tool.uv.sources]
mcp-fw = { workspace = true }
medops-common = { workspace = true }
