[project]
name = "mcp-ecg"
version = "0.1.0"
description = "ECG device MCP server: waveform quality and export checks (simulated)."
requires-python = ">=3.11,<3.13"
dependencies = [
    "mcp-fw",
    "medops-common",
]

[project.scripts]
mcp-ecg = "mcp_ecg.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_ecg"]

[tool.uv.sources]
mcp-fw = { workspace = true }
medops-common = { workspace = true }
