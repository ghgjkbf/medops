[project]
name = "mcp-ventilator"
version = "0.1.0"
description = "Ventilator MCP server: realtime params and self-test (simulated)."
requires-python = ">=3.11,<3.13"
dependencies = [
    "mcp-fw",
    "medops-common",
]

[project.scripts]
mcp-ventilator = "mcp_ventilator.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_ventilator"]

[tool.uv.sources]
mcp-fw = { workspace = true }
medops-common = { workspace = true }
