[project]
name = "medops-sim"
version = "0.1.0"
description = "Medical device simulators (CT / DR / ventilator / ECG)."
requires-python = ">=3.11,<3.13"
dependencies = [
    "medops-engine",
    "medops-common",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/medops_sim"]

[tool.uv.sources]
medops-engine = { workspace = true }
medops-common = { workspace = true }
